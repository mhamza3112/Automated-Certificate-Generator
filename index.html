<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Generator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="card">
        <h1>Certificate Generator</h1>
        <p>Create & Email Internship Certificates</p>

        <form id="form">
            <input type="text" id="name" placeholder="Intern Name" required>
            <input type="email" id="email" placeholder="Intern Email" required>
            <input type="text" id="domain" placeholder="Internship Domain" required>
            <input type="date" id="date" required>

            <button type="submit">Generate Certificate</button>
        </form>

        <div id="loader"></div>
        <p id="message"></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
